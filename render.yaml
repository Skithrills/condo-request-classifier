# Render Blueprint: Dashboard > New > Blueprint, then pick this repo.
# A free web service: the bot sees RENDER_EXTERNAL_URL and switches to webhook mode.
# Render sleeps it after 15 idle minutes; a Telegram message wakes it, so the first
# reply after a nap is slow. For an always-on bot, use `type: worker` and
# `plan: starter` (paid), which polls Telegram instead.
services:
  - type: web
    name: condo-telegram-bot
    runtime: python
    plan: free
    buildCommand: >-
      pip install uv &&
      uv export --frozen --no-dev --extra telegram --no-emit-project -o requirements-render.txt &&
      pip install -r requirements-render.txt
    startCommand: python -m condo_classifier.telegram_bot
    # Only bot code changes redeploy, so pushes to docs, slides or data save build minutes.
    buildFilter:
      paths:
        - condo_classifier/**
        - pyproject.toml
        - uv.lock
    envVars:
      # Secrets: Render asks for these when the Blueprint is created.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STAFF_CHAT_ID
        sync: false
      - key: BOT_REPLIES
        value: chat
      - key: CLASSIFIER_BACKEND
        value: baseline
